<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ultima Supermarket – Staff Application</title>
<link rel="icon" id="ico" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#06040c;--card:rgba(20,14,36,.78);--line:#3b2a63;--text:#f1ecfb;--muted:#a79bc7;--pu:#8b5cf6;--ok:#57f287;--bad:#ff6b6b}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.55}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
.bg i{position:absolute;width:55vmax;height:55vmax;border-radius:50%;filter:blur(90px);opacity:.42}
.bg i:nth-child(1){background:#7c3aed;left:-18vmax;top:-18vmax;animation:a 24s ease-in-out infinite alternate}
.bg i:nth-child(2){background:#4c1d95;right:-20vmax;bottom:-20vmax;animation:b 28s ease-in-out infinite alternate}
.bg i:nth-child(3){background:#a855f7;width:30vmax;height:30vmax;left:40%;top:30%;opacity:.22;animation:c 20s ease-in-out infinite alternate}
@keyframes a{to{transform:translate(35vmax,22vmax) scale(1.2)}}
@keyframes b{to{transform:translate(-30vmax,-25vmax) scale(.85)}}
@keyframes c{to{transform:translate(-25vmax,20vmax) scale(1.4)}}
@media (prefers-reduced-motion:reduce){.bg i{animation:none}}
header{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;max-width:720px;margin:0 auto;padding:20px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800}
.brand img{width:40px;height:40px;border-radius:50%}
#langs{display:flex;flex-wrap:wrap;gap:6px}
#langs button{background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font:inherit;font-size:.88rem;cursor:pointer}
#langs button[aria-pressed=true]{background:var(--pu);border-color:var(--pu);color:#fff}
main{max-width:720px;margin:0 auto;padding:8px 20px 80px}
.hero{text-align:center;margin-bottom:24px}
.hero img{width:140px;height:140px;border-radius:50%;filter:drop-shadow(0 0 28px rgba(139,92,246,.6))}
h1{font-size:clamp(1.9rem,6vw,3rem);line-height:1.08;margin:12px 0;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.35rem;margin:0 0 16px}
p{color:var(--muted);margin:0 0 20px}
.card{background:var(--card);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:16px;padding:26px}
.btn{display:inline-flex;align-items:center;gap:10px;background:#5865f2;color:#fff;border:0;border-radius:10px;padding:14px 22px;font:inherit;font-weight:600;cursor:pointer}
.btn.pu{background:var(--pu)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted);padding:8px 14px;font-size:.9rem}
.btn:hover{filter:brightness(1.12)}
.btn:disabled{opacity:.5;cursor:wait}
:focus-visible{outline:3px solid var(--ok);outline-offset:2px}
.hidden{display:none!important}
ul{padding-left:18px;color:var(--muted);margin:0 0 24px}
li{margin-bottom:6px}
.user{display:flex;align-items:center;gap:12px;margin-bottom:24px;color:var(--muted);font-size:.95rem;flex-wrap:wrap}
.user img{width:40px;height:40px;border-radius:50%}
.user b{color:var(--text)}
.user .btn{margin-left:auto}
.field{margin-bottom:20px}
.field label{display:block;font-weight:600;margin-bottom:6px}
.field em{font-style:normal;font-weight:400;color:var(--muted);margin-left:6px}
input[type=text],input[type=number],select,textarea{width:100%;background:rgba(6,4,12,.7);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font:inherit}
textarea{resize:vertical}
.field.bad input,.field.bad select,.field.bad textarea{border-color:var(--bad)}
.err{color:var(--bad);font-size:.88rem;margin-top:4px}
.chk{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.chk input{margin-top:5px;width:18px;height:18px;accent-color:var(--pu)}
.chk label{flex:1;font-weight:400;margin:0}
.chk .err{flex-basis:100%}
.msg{border-radius:10px;padding:14px 16px;margin-top:16px}
.msg.err{background:rgba(255,107,107,.14);border:1px solid var(--bad);color:var(--text)}
.msg.ok{background:rgba(87,242,135,.12);border:1px solid var(--ok)}
</style>
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>
<header>
  <div class="brand"><img data-logo alt=""><span>Ultima Supermarket</span></div>
  <div id="langs" role="group" aria-label="Language"></div>
</header>
<main>
  <section id="s-login">
    <div class="hero"><img data-logo alt="Ultima Supermarket logo"><h1 data-s="title"></h1><p data-s="sub"></p></div>
    <div class="card">
      <h2 data-s="before"></h2>
      <ul><li data-s="r1"></li><li data-s="r2"></li><li data-s="r3"></li></ul>
      <button class="btn" id="btn-login" data-s="login"></button>
      <div id="warn" class="msg err hidden"></div>
      <div id="closed" class="msg err hidden"><b data-s="closedT"></b><br><span data-s="closedP"></span></div>
    </div>
  </section>

  <section id="s-form" class="card hidden">
    <div class="user"><img id="av" alt=""><span><span data-s="logged"></span> <b id="uname"></b></span><button class="btn ghost" id="btn-out" data-s="logout"></button></div>
    <form id="f" novalidate></form>
    <button class="btn pu" id="btn-send" data-s="submit"></button>
  </section>

  <section id="s-end" class="card hidden">
    <h2 id="end-t"></h2><p id="end-p"></p><div id="end-m" class="msg ok" data-s="close"></div>
  </section>
</main>

const $ = id => document.getElementById(id);
const safeGet = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
const safeSet = (k,v) => { try { localStorage.setItem(k,v); } catch(e){} };
let L = LANGS.indexOf(safeGet("lang"));
if (L < 0) L = Math.max(0, LANGS.indexOf((navigator.language || "en").slice(0,2)));
const t = k => S[k][L].replace("{n}", MIN_AGE);
const show = id => ["s-login","s-form","s-end"].forEach(s => $(s).classList.toggle("hidden", s !== id));
let user = null, endKeys = null, accessToken = null, closed = !APPLICATIONS_OPEN;

/* --- Are applications open? Set directly in this file (APPLICATIONS_OPEN above) --- */
function checkOpen() {
  if (closed) { $("closed").classList.remove("hidden"); $("btn-login").disabled = true; }
}

/* --- Build form once --- */
Q.forEach((q,i) => {
  const [id, ty, rq, , op] = q;
  const w = document.createElement("div"); w.className = ty === "c" ? "field chk" : "field";
  const l = document.createElement("label"); l.htmlFor = "f_" + id;
  const sp = document.createElement("span"); sp.dataset.q = i; l.appendChild(sp);
  if (!rq) { const e = document.createElement("em"); e.dataset.s = "opt"; l.appendChild(e); }
  let el;
  if (ty === "a") { el = document.createElement("textarea"); el.rows = 4; el.maxLength = 450; }
  else if (ty === "s") { el = document.createElement("select"); el.appendChild(new Option("—", "")); op.forEach((o,j) => { const x = new Option("", j); x.dataset.q = i; x.dataset.o = j; el.appendChild(x); }); }
  else { el = document.createElement("input"); el.type = ty === "n" ? "number" : ty === "c" ? "checkbox" : "text"; if (ty === "n") { el.min = 10; el.max = 99; } }
  el.id = "f_" + id;
  const er = document.createElement("div"); er.className = "err"; er.id = "e_" + id;
  if (ty === "c") w.append(el, l, er); else w.append(l, el, er);
  $("f").appendChild(w);
});

/* --- Language --- */
function applyLang() {
  document.documentElement.lang = LANGS[L];
  document.querySelectorAll("[data-s]").forEach(e => { e.textContent = t(e.dataset.s); });
  Q.forEach((q,i) => {
    document.querySelector(`span[data-q="${i}"]`).textContent = q[3][L];
    if (q[4]) q[4].forEach((o,j) => { document.querySelector(`option[data-q="${i}"][data-o="${j}"]`).textContent = typeof o === "string" ? o : o[L]; });
  });
  if (endKeys) { $("end-t").textContent = t(endKeys[0]); $("end-p").textContent = t(endKeys[1]); }
  [...$("langs").children].forEach((b,i) => b.setAttribute("aria-pressed", i === L));
}
NAMES.forEach((n,i) => { const b = document.createElement("button"); b.type = "button"; b.textContent = n; b.onclick = () => { L = i; safeSet("lang", LANGS[i]); applyLang(); }; $("langs").appendChild(b); });

/* --- Discord login (OAuth2 implicit grant, "identify" scope) --- */
function warn(key) { const w = $("warn"); w.dataset.s = key; w.textContent = t(key); w.classList.remove("hidden"); }
$("btn-login").onclick = () => {
  if (!CLIENT_ID || !WEBHOOK_URL) { warn("noCfg"); return; }
  const redirect = location.origin + location.pathname;
  location.href = "https://discord.com/oauth2/authorize?response_type=token&client_id=" + encodeURIComponent(CLIENT_ID) +
    "&scope=identify&redirect_uri=" + encodeURIComponent(redirect);
};

async function init() {
  applyLang();
  checkOpen();
  if (closed) return;
  const token = new URLSearchParams(location.hash.slice(1)).get("access_token");
  if (!token) return;
  accessToken = token;
  history.replaceState(null, "", location.pathname);
  try {
    const r = await fetch("https://discord.com/api/users/@me", { headers: { Authorization: "Bearer " + token } });
    if (!r.ok) throw new Error();
    user = await r.json();
  } catch (e) { warn("loginFail"); return; }
  if (safeGet("applied_" + user.id)) { endScreen("doneT2", "doneP2"); return; }
  $("av").src = avatarUrl();
  $("uname").textContent = user.global_name || user.username;
  show("s-form");
}
const avatarUrl = () => user.avatar ? `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png?size=64` : "https://cdn.discordapp.com/embed/avatars/0.png";

/* --- Log out --- */
$("btn-out").onclick = () => {
  if (!confirm(t("logoutQ"))) return;
  user = null; accessToken = null; $("f").reset();
  document.querySelectorAll(".err").forEach(e => { e.textContent = ""; e.removeAttribute("data-s"); });
  document.querySelectorAll(".bad").forEach(e => e.classList.remove("bad"));
  show("s-login");
};

/* --- Validate and send --- */
$("btn-send").onclick = async () => {
  let first = null;
  Q.forEach(q => {
    const [id, ty, rq] = q, el = $("f_" + id), er = $("e_" + id);
    const v = ty === "c" ? el.checked : el.value.trim();
    let key = "";
    if (rq && !v) key = "req";
    else if (ty === "a" && rq && v.length < 40) key = "short";
    else if (id === "age" && Number(v) < MIN_AGE) key = "age";
    if (key) { er.dataset.s = key; er.textContent = t(key); } else { er.removeAttribute("data-s"); er.textContent = ""; }
    er.parentElement.classList.toggle("bad", !!key);
    if (key && !first) first = er.parentElement;
  });
  if (first) { first.scrollIntoView({ behavior: "smooth", block: "center" }); return; }

  $("btn-send").disabled = true;
  const answers = Q.map(q => {
    const el = $("f_" + q[0]); let v;
    if (q[1] === "c") v = el.checked ? "✅ Yes" : "❌ No";
    else if (q[1] === "s") { const o = q[4][el.value]; v = typeof o === "string" ? o : o[0]; }
    else v = el.value.trim();
    return { name: q[3][0].slice(0, 256), value: (v || "—").slice(0, 1000) };
  });

  // Message envoyé directement au webhook Discord : ton bot relit cet embed
  // (champs "Applicant", "User ID", "Site language" puis les questions/réponses)
  // et le transforme en panneau V2 avec les boutons Accept / Refuse.
  const body = {
    username: "Ultima Applications",
    embeds: [{
      title: "New staff application – Ultima Supermarket",
      color: 0x8b5cf6,
      thumbnail: { url: avatarUrl() },
      fields: [
        { name: "Applicant", value: `<@${user.id}> (${user.username})`, inline: true },
        { name: "User ID", value: user.id, inline: true },
        { name: "Site language", value: LANGS[L].toUpperCase(), inline: true },
        ...answers
      ],
      timestamp: new Date().toISOString()
    }]
  };

  try {
    const r = await fetch(WEBHOOK_URL + "?wait=true", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    if (!r.ok) throw new Error();
    safeSet("applied_" + user.id, "1");
    endScreen("doneT", "doneP");
  } catch (e) {
    endScreen("errT", "errP"); $("end-m").classList.add("hidden");
    $("btn-send").disabled = false;
  }
};

function endScreen(tk, pk) {
  endKeys = [tk, pk]; show("s-end");
  $("end-m").classList.remove("hidden"); applyLang();
}

init();
</script>
</body>
</html>
